<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIH 2026 Standard Recommender</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f7f6; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 72%; padding: 10px; margin-right: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #results { margin-top: 20px; }
        .card { background: #f9f9f9; padding: 12px; margin-bottom: 10px; border-left: 4px solid #007bff; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Government Standard Recommendation Engine</h2>
        <p>Enter your technical specifications or requirement query below:</p>
        <input type="text" id="queryInput" placeholder="e.g., PVC insulated electrical cable">
        <button onclick="getRecommendations()">Search Standards</button>
        <div id="results"></div>
    </div>
    <script>
        async function getRecommendations() {
            const query = document.getElementById('queryInput').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Processing AI recommendation...</p>';

            try {
                const response = await fetch('http://127.0.0.1:5000/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                resultsDiv.innerHTML = '<h3>Top Matches:</h3>';
                if (data.matches && data.matches.length > 0) {
                    data.matches.forEach(match => {
                        resultsDiv.innerHTML += `<div class="card"><strong>Match Score: ${match.score}</strong><p>${JSON.stringify(match.details)}</p></div>`;
                    });
                } else {
                    resultsDiv.innerHTML += '<p>No relevant standards found.</p>';
                }
            } catch (err) {
                resultsDiv.innerHTML = '<p style="color: red;">Error connecting to the backend server.</p>';
            }
        }
    </script>
</body>
</html>
